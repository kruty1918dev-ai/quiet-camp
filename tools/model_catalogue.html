<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet Camp — моделі для діорам</title>
<style>body{margin:0;background:#f0eee4;color:#27382e;font:16px system-ui}header{padding:28px 4vw;background:#dbe4d4}h1{margin:0 0 12px;font-size:30px}p{max-width:850px;line-height:1.5}nav{display:flex;gap:12px;flex-wrap:wrap}input,select{padding:12px;border:1px solid #81917d;border-radius:8px;font:inherit;background:#faf9f1}main{padding:24px 4vw}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}article{background:#fffdf4;border:1px solid #d6dbca;border-radius:14px;padding:16px}h2{font-size:19px;margin:12px 0 8px}.photos{display:flex;gap:4px}.photos a{width:50%}.photos img{width:100%;aspect-ratio:1;object-fit:contain;background:#e1e4dc;border-radius:8px}.badge{display:inline-block;background:#e3e9d9;padding:4px 9px;border-radius:5px;font-size:13px}small{color:#536550}details{font-size:13px;overflow-wrap:anywhere}summary{cursor:pointer}button{padding:12px 24px;border:0;border-radius:8px;background:#395f43;color:white;font:inherit;margin-top:20px}</style>
<header><h1>Бібліотека моделей Quiet Camp</h1><p>1 210 джерел, кожне оглянуто у двох ракурсах Unity. Кандидати для українських діорам, резерв і моделі, що потребують матеріалу чи спрощення. Повні фотографії доступні на ноутбуці з імпортованими пакетами.</p><nav><input id="q" placeholder="Пошук: береза, криниця, назва, ID…" aria-label="Пошук моделей"><select id="category" aria-label="Категорія"><option value="">Усі категорії</option></select><select id="fit" aria-label="Придатність"><option value="">Усі рекомендації</option></select></nav></header>
<main><p id="count" role="status"></p><div id="grid" class="grid"></div><button id="more">Показати ще</button></main>
<script>const data=/*CATALOGUE_DATA*/;let limit=60;const by=id=>document.getElementById(id);for(const [id,key] of [['category','categoryUk'],['fit','fitUk']])for(const value of [...new Set(data.models.map(m=>m[key]))].sort())by(id).add(new Option(value,value));
function el(tag,text){const x=document.createElement(tag);if(text)x.textContent=text;return x}function update(){const query=by('q').value.toLocaleLowerCase('uk');const models=data.models.filter(m=>(!by('category').value||m.categoryUk===by('category').value)&&(!by('fit').value||m.fitUk===by('fit').value)&&[m.displayId,m.name,m.titleUk,m.descriptionUk,m.path].join(' ').toLocaleLowerCase('uk').includes(query));by('count').textContent=`Знайдено ${models.length} / ${data.models.length} моделей. Показано ${Math.min(limit,models.length)}.`;by('grid').replaceChildren();for(const m of models.slice(0,limit)){const a=el('article');const p=el('div');p.className='photos';for(const photo of m.images){const link=el('a');link.href='LocalPreviews~/'+photo;const im=el('img');im.src=link.href;im.loading='lazy';im.alt=m.titleUk+' — '+(photo.includes('front')?'перший':'зворотний')+' ракурс';link.append(im);p.append(link)}a.append(p,el('h2',m.titleUk));const b=el('span',m.fitUk);b.className='badge';a.append(b,el('p',m.descriptionUk),el('small',m.displayId+' · '+m.categoryUk));const d=el('details');d.append(el('summary','Джерело та візуальний огляд'),el('p',m.name+'\n'+m.path),el('p',m.visualReview.observationUk),el('p',m.triangles.toLocaleString('uk')+' трикутників у source root; '+m.materialBinding),el('p','SHA-256: '+m.sourceHash));a.append(d);by('grid').append(a)}by('more').hidden=limit>=models.length}for(const id of ['q','category','fit'])by(id).addEventListener('input',()=>{limit=60;update()});by('more').onclick=()=>{limit+=60;update()};update();</script></html>
