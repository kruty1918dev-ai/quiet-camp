<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Правила кемпінгу</title><desc id="desc">Оригінальна пояснювальна схема документації, не screenshot Unity.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#819477"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f3efe3"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#243e35"><text x="38" y="50" font-size="30">Чотири побажання гостя</text><text x="38" y="80" font-size="17">Умовні схеми правил · не готовий рівень і не скріншот гри</text><rect x="30" y="125" width="275" height="450" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="50" y="165" font-size="25">Шлях</text><text x="50" y="197" font-size="17">Дійти до дверей</text><path d="M70 490 L70 390 L200 390 L200 320" fill="none" stroke="#b69b72" stroke-width="20"/><path d="M115 373 L170 290 L225 373Z" fill="#af7c60"/><path d="M156 373 L170 337 L184 373Z" fill="#243e35"/><text x="50" y="548" font-size="14">Спільний шлях дозволений</text><rect x="325" y="125" width="275" height="450" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="345" y="165" font-size="25">Тінь</text><text x="345" y="197" font-size="17">Увесь намет у тіні</text><ellipse cx="462" cy="360" rx="107" ry="115" fill="#a9ba99"/><path d="M410 373 L465 290 L520 373Z" fill="#af7c60"/><path d="M451 373 L465 337 L479 373Z" fill="#243e35"/><text x="345" y="548" font-size="14">Перевіряється footprint</text><rect x="620" y="125" width="275" height="450" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="640" y="165" font-size="25">Тиша</text><text x="640" y="197" font-size="17">Поза шумом вогню</text><circle cx="688" cy="460" r="74" fill="#dfc7a2"/><path d="M668 470 L690 414 L711 470Z" fill="#b47756"/><path d="M745 373 L800 290 L855 373Z" fill="#af7c60"/><path d="M786 373 L800 337 L814 373Z" fill="#243e35"/><text x="640" y="548" font-size="14">Шумова зона визначена рівнем</text><rect x="915" y="125" width="275" height="450" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="935" y="165" font-size="25">Друзі</text><text x="935" y="197" font-size="17">До 3 кроків між дверима</text><path d="M1000 373 L1055 290 L1110 373Z" fill="#af7c60"/><path d="M1041 373 L1055 337 L1069 373Z" fill="#243e35"/><path d="M977 460 L1010 407 L1043 460Z" fill="#baa171"/><path d="M1018 448 L1055 374" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><text x="935" y="548" font-size="14">Кроки рахуються проходом</text></g></svg>