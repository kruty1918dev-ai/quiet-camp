<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Панелі gameplay</title><desc id="desc">Оригінальна пояснювальна схема документації, не screenshot Unity.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#819477"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f3efe3"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#243e35"><text x="40" y="48" font-size="30">Орієнтири на ігровому екрані</text><text x="40" y="78" font-size="17">Схема станів HUD · кнопки зʼявляються за умовами сесії</text><rect x="360" y="112" width="480" height="535" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="380" y="152" font-size="25">Галявина</text><text x="380" y="184" font-size="17">Торкнись, перетягни й поверни намет</text><rect x="382" y="220" width="180" height="85" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="402" y="260" font-size="25">Підказка</text><text x="402" y="292" font-size="17">Верх екрана</text><rect x="640" y="220" width="178" height="85" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="660" y="260" font-size="25">Пауза</text><text x="660" y="292" font-size="17">Меню допомоги</text><rect x="382" y="450" width="436" height="85" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="402" y="490" font-size="25">Гості · undo · redo · перевірка</text><text x="402" y="522" font-size="17">Історія та готовність розташування</text><rect x="382" y="550" width="436" height="75" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="402" y="590" font-size="25">Картка гостя</text><text x="402" y="622" font-size="17">Імʼя · намет · побажання</text><text x="50" y="260" font-size="20">Над наметом:</text><text x="50" y="295" font-size="17">імʼя, повернути, прибрати</text><path d="M280 280 L360 360" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><text x="865" y="430" font-size="20">Одна причина помилки</text><text x="865" y="465" font-size="17">або пояснення розміщення</text><path d="M864 450 L838 400" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/></g></svg>