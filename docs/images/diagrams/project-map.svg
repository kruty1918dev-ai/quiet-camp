<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Структура Quiet Camp</title><desc id="desc">Оригінальна пояснювальна схема документації, не screenshot Unity.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#819477"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f3efe3"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#243e35"><text x="38" y="50" font-size="30">Хто за що відповідає в проєкті</text><text x="38" y="82" font-size="17">Дані рівня → правила → команда гравця → видимий табір</text><rect x="40" y="145" width="250" height="115" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="60" y="185" font-size="25">Resources</text><text x="60" y="217" font-size="17">JSON · HTML · палітра</text><rect x="330" y="145" width="250" height="115" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="350" y="185" font-size="25">Domain</text><text x="350" y="217" font-size="17">Сітка · двері · побажання</text><rect x="620" y="145" width="250" height="115" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="640" y="185" font-size="25">Application</text><text x="640" y="217" font-size="17">Сесія · історія · прогрес</text><rect x="910" y="145" width="250" height="115" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="930" y="185" font-size="25">Presentation</text><text x="930" y="217" font-size="17">Unity · камера · UI</text><rect x="330" y="420" width="300" height="115" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="350" y="460" font-size="25">Infrastructure</text><text x="350" y="492" font-size="17">Завантаження · local save</text><rect x="700" y="420" width="330" height="115" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="720" y="460" font-size="25">Documentation</text><text x="7