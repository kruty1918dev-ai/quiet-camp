<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Навігація екранами Quiet Camp</title><desc id="desc">Оригінальна пояснювальна схема документації, не screenshot Unity.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#819477"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f3efe3"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#243e35"><text x="38" y="50" font-size="30">Як рухатися між екранами</text><text x="38" y="81" font-size="17">Пілот QC001–QC005 · перемога повертає на дорогу</text><rect x="45" y="120" width="240" height="100" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="65" y="160" font-size="25">Boot</text><text x="65" y="192" font-size="17">Документ → увійти</text><rect x="450" y="120" width="280" height="100" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="470" y="160" font-size="25">Головне меню</text><text x="470" y="192" font-size="17">Почати / продовжити</text><rect x="885" y="120" width="270" height="100" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="905" y="160" font-size="25">Налаштування</text><text x="905" y="192" font-size="17">Звук · комфорт · вигляд</text><rect x="55" y="350" width="280" height="100" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="75" y="390" font-size="25">Українська долина</text><text x="75" y="422" font-size="17">Камінь → галявина</text><rect x="450" y="350" width="280" height="100" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="470" y="390" font-size="25">Кемпінг</text><text x="470" y="422" font-size="17">Розташувати → перевірити</text><rect x="875" y="350" width="280" height="100" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="895" y="390" font-size="25">Мої табори</text><text x="895" y="422" font-size="17">Спогади → залишитись</text><rect x="450" y="565" width="280" height="100" rx="16" fill="#e2e6d4" stroke="#819477" stroke-width="2"/><text x="470" y="605" font-size="25">Пауза й допомога</text><text x="470" y="637" font-size="17">Гості · знаки · ресурси</text><path d="M285 170 L450 170" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 170 L885 170" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><path d="M520 220 L190 350" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><path d="M670 220 L1000 350" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 375 C390 290 330 290 300 350" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><text x="315" y="303" font-size="15">Після перемоги</text><path d="M335 400 L450 400" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 400 L875 400" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 450 L590 565" fill="none" stroke="#819477" stroke-width="3" marker-end="url(#arrow)"/></g></svg>