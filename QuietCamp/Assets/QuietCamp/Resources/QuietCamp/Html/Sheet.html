<view class="sheet-zone" data-safe-area="all">
  <view class="surface sheet" id="sheet" data-motion-role="edge-bottom">
    <view class="nav">{{nav}}<text class="title">{{title}}</text></view>
    <scroll id="sheet-scroll"><view class="scroll-content" id="{{body-id}}" data-motion-role="panel">{{body}}</view></scroll>
    {{footer}}
  </view>
</view>
