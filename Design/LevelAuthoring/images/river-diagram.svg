<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Як точки керують річкою</title><desc id="desc">Плавна річка з трьома контрольними точками. Зелені береги утворюються навколо кривої. Ігрове поле лежить збоку.</desc>
