<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тихий кемпінг — галерея</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3efe3;color:#243e35;font-family:Segoe UI,Arial,sans-serif}header{padding:36px max(24px,5vw) 22px}small{letter-spacing:3px;text-transform:uppercase;font-size:11px;color:#647e64}h1{margin:12px 0;font-size:clamp(28px,4vw,48px);letter-spacing:-1px}p{max-width:760px;line-height:1.6;color:#526756}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button,a{font:inherit}button{border:1px solid #9ca992;background:transparent;color:#243e35;border-radius:100px;padding:10px 18px;cursor:pointer}button.active{background:#243e35;color:#f3efe3}button:focus-visible,a:focus-visible{outline:3px solid #b87536;outline-offset:4px}a{color:#355c40}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:0 max(24px,5vw) 48px;max-width:1600px;margin:auto}figure{margin:0}figure img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 10px 24px #243e3524}figcaption{padding:12px 0;font-size:15px;font-weight:600}.meta{font-size:12px;color:#70806b;font-weight:400;margin-top:4px}footer{padding:0 5vw 30px;color:#526756;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style>
<header><small>QuietCamp · Українська галерея</small><h1>Трохи тепла. Трохи спокою.</h1><p>Шість художніх промоконцептів для майбутньої галереї гри. Це AI-ілюстрації; вони не є скриншотами поточного білда.</p><nav aria-label="Формат"><button class="active" data-folder="google-play">Google Play · 1080 × 1920</button><button data-folder="app-store-iphone">iPhone · 1320 × 2868</button><button data-folder="masters">Оригінали</button></nav><p><a href="gallery-overview.jpg">Огляд усієї серії</a> · <a href="README-UA.md">Опис комплекту</a></p></header><main class="grid" id="gallery"></main><footer>Натисніть зображення, щоб відкрити PNG у повному розмірі. Порядок 01–06.</footer>
<script>const cards=[['01-find-your-calm.png','Знайди свій куточок спокою'],['02-a-place-for-everyone.png','Знайди місце для кожного'],['03-shade-and-care.png','Трохи тіні. Трохи турботи.'],['04-at-your-own-pace.png','Грай у своєму темпі'],['05-a-warm-evening.png','Маленька перемога. Теплий вечір.'],['06-come-by-the-fire.png','Твій затишок починається тут']];function show(folder){document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.folder===folder);b.setAttribute('aria-pressed',String(b.dataset.folder===folder))});document.getElementById('gallery').replaceChildren(...cards.map(([file,title],i)=>{const f=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),c=document.createElement('figcaption');a.href=folder+'/'+file;img.src=a.href;img.alt=title;img.loading='eager';a.append(img);c.textContent=String(i+1).padStart(2,'0')+' · '+title;f.append(a,c);return f}))}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.folder)));show('google-play');</script></html>
